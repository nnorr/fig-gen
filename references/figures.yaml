# Exemplar hardware figures: style anchors for references/CONVENTIONS.md
#
# Fields: see CONVENTIONS.md. verified: true means a research agent opened the
# paper PDF (open-access copy) and confirmed the figure number and caption text.
# conventions_demonstrated comes from captions, body text and in-figure text labels
# extracted from the PDF. Figure IMAGES were not inspected or copied, so claims
# about color or shading come only from the caption/text, as stated per entry.
# access: open = an open copy exists (arXiv, IACR, or an author-hosted copy of a
# publisher-paywalled paper; see note).
# DOIs appear only when seen on Crossref, a publisher/arXiv page, or in the PDF; otherwise null.
# Copyright: no figure images are stored in this repo. Open PDFs are cached in
# references/local/ (gitignored).
#
# Count: 48 figures, 43 verified, 5 unverified.
# Coverage gaps: no verified ISSCC / VLSI Symp. / CICC / ESSCIRC / DAC-proper
# circuit figures (no open PDFs found for e.g. Envision, UNPU); no FCCM paper
# (Zhang et al. is FPGA'15); textbook anchors are unverified.
#
# F41-F48 (and notes on F36/F37) were added in a bus-operations pass: the page was
# rendered locally (scratchpad, not the repo) and the DRAWING itself was inspected
# for split / truncation / concatenation / extension glyphs.

